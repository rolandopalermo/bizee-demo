<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-header border-bottom px-3 px-lg-4 py-2 d-flex align-items-center justify-content-between gap-2"
		th:fragment="header">
	<div class="d-flex align-items-center gap-2">
		<button class="btn btn-outline-secondary d-lg-none"
				type="button"
				data-bs-toggle="offcanvas"
				data-bs-target="#appSidebarOffcanvas"
				aria-controls="appSidebarOffcanvas"
				aria-label="Open navigation">
			<i class="bi bi-list" aria-hidden="true"></i>
		</button>
		<span class="text-secondary small d-none d-sm-inline">Admin panel</span>
	</div>
	<div class="d-flex align-items-center gap-3">
		<div class="text-end small" th:if="${session.AUTHENTICATED_DISPLAY_NAME != null or session.AUTHENTICATED_EMAIL != null}">
			<div class="fw-semibold" th:text="${session.AUTHENTICATED_DISPLAY_NAME}">User</div>
			<div class="text-secondary" th:if="${session.AUTHENTICATED_EMAIL}" th:text="${session.AUTHENTICATED_EMAIL}">email</div>
		</div>
		<form th:action="@{/logout}" method="post" class="mb-0">
			<button type="submit" class="btn btn-outline-secondary btn-sm">
				<i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Log out
			</button>
		</form>
	</div>
</header>
</body>
</html>
