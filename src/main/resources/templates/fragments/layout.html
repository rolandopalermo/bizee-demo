<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (pageTitle, activeNav, content)">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title th:text="${pageTitle}">Bizee Demo</title>
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
	<link rel="stylesheet" th:href="@{/css/app.css}"/>
	<link rel="stylesheet" th:href="@{/css/layout.css}"/>
	<link rel="stylesheet" th:href="@{/css/components.css}"/>
</head>
<body class="app-body">
<div class="container-fluid app-shell">
	<div class="row g-0">
		<aside th:replace="~{fragments/sidebar :: sidebar(${activeNav}, false)}"></aside>

		<div class="col app-main d-flex flex-column min-vh-100">
			<header th:replace="~{fragments/header :: header}"></header>
			<main class="app-content flex-grow-1 px-3 px-lg-4 py-3">
				<div class="container-fluid px-0">
					<div th:replace="${content}"></div>
				</div>
			</main>
		</div>
	</div>
</div>

<div class="offcanvas offcanvas-start app-sidebar-offcanvas"
	 tabindex="-1"
	 id="appSidebarOffcanvas"
	 aria-labelledby="appSidebarOffcanvasLabel">
	<div class="offcanvas-header border-bottom border-secondary">
		<a class="app-sidebar-brand" th:href="@{/home}" id="appSidebarOffcanvasLabel">Bizee Demo</a>
		<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
	</div>
	<div class="offcanvas-body p-0">
		<div th:replace="~{fragments/sidebar :: sidebar(${activeNav}, true)}"></div>
	</div>
</div>

<div class="modal fade" id="appConfirmModal" tabindex="-1" aria-labelledby="appConfirmModalLabel" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h2 class="modal-title fs-5" id="appConfirmModalLabel">Confirm</h2>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<p class="mb-0" data-app-confirm-message>Are you sure?</p>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-danger" data-app-confirm-submit>Delete</button>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/http.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/states-select.js}"></script>
</body>
</html>
