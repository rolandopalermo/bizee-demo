<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{fragments/layout :: layout('Users — Bizee Demo', 'users', ~{::section})}">
<head>
	<title>Users — Bizee Demo</title>
</head>
<body>
<section>
	<header class="app-page-header d-flex flex-wrap justify-content-between align-items-start gap-3">
		<div>
			<h1 class="h3 mb-1">Users</h1>
			<p class="text-secondary mb-0">Admin and demo user accounts.</p>
		</div>
		<a class="btn btn-primary" th:href="@{/users/new}">
			<i class="bi bi-plus-lg me-1" aria-hidden="true"></i>New user
		</a>
	</header>

	<div th:replace="~{fragments/ui :: alerts}"></div>

	<div class="card shadow-sm">
		<div class="card-body p-0">
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
					<tr>
						<th scope="col">ID</th>
						<th scope="col">Name</th>
						<th scope="col">Email</th>
						<th scope="col" class="text-end">Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="u : ${users}">
						<td th:text="${u.id()}">1</td>
						<td th:text="${u.name()}">Name</td>
						<td th:text="${u.email()}">email</td>
						<td class="text-end app-table-actions">
							<a class="btn btn-outline-primary btn-sm"
							   th:href="@{/users/{id}/edit(id=${u.id()})}">Edit</a>
							<form class="d-inline"
								  th:action="@{/users/{id}/delete(id=${u.id()})}"
								  method="post"
								  data-app-confirm="Delete this user? This cannot be undone.">
								<button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(users)}">
						<td colspan="4" class="text-center text-secondary py-4">No users found.</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</section>
</body>
</html>
