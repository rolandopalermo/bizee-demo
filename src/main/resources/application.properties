spring.application.name=bizee-demo
# =====================================================
# DATASOURCE
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bizee
spring.datasource.username=bizee
spring.datasource.password=bizee
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================
# RABBITMQ (local docker-compose)
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=bizee
spring.rabbitmq.password=bizee
spring.rabbitmq.listener.simple.shutdown-timeout=5s

# Browser UI auth: session-based login against the users table (no Spring Security).